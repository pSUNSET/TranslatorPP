plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Curse Maven"
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$architectury_api_version"

    // Mod Menu
    modApi "com.terraformersmc:modmenu:$modmenu_version"

    // Cloth Config
    modApi("me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version") { exclude(group: "net.fabricmc.fabric-api") }

    // JEI, REI, EMI?
//    modCompileOnlyApi "mezz.jei:jei-$minecraft_version-fabric-api:$jei_version"
//    modCompileOnlyApi "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"

    modRuntimeOnly "mezz.jei:jei-$minecraft_version-fabric:$jei_version"
//    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"

    // FTB Quests
//    modImplementation "curse.maven:ftb-quests-fabric-438496:6661412"
//    modImplementation "curse.maven:ftb-library-fabric-438495:6711325"
//    modImplementation "curse.maven:ftb-teams-fabric-438497:6119436"

    // Jade
    modImplementation "curse.maven:jade-324717:6494189"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'group', project.group

    filesMatching('fabric.mod.json') {
        expand(
                mod_id: mod_id,
                version: project.version,
                group: project.group,
                minecraft_version_fabric_range: minecraft_version_fabric_range,
                architectury_api_version_fabric_range: architectury_api_version_fabric_range,
                fabric_loader_version_range: fabric_loader_version_range,
                fabric_api_version_range: fabric_api_version_range
        )
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "Project SUNSET",
                'Specification-Version'   : "1",
                'Implementation-Title'    : this.project.name,
                'Implementation-Version'  : this.project.jar.archiveVersion,
                'Implementation-Vendor'   : "Project SUNSET",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
