plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file("src/main/resources/translatorpp.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version+$minecraft_version"

    // Mod Menu
    implementation "com.terraformersmc:modmenu:$modmenu_version"

    // Cloth Config
    runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version") { exclude(group: "net.fabricmc.fabric-api") }

    // JEI, REI, EMI? (Unused)
//    compileOnly "mezz.jei:jei-$minecraft_version-fabric-api:$jei_version"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"

//    runtimeOnly "mezz.jei:jei-$minecraft_version-fabric:$jei_version"
//    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"

    // FTB Quests

    // Jade
//    implementation "maven.modrinth:jade:$jade_fabric_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', "$mod_version"
    inputs.property 'group', "$maven_group"

    filesMatching('fabric.mod.json') {
        expand(
                version: "$mod_version",
                minecraft_version_fabric_range: "$minecraft_version_fabric_range",
                fabric_loader_version_range: "$fabric_loader_version_range",
                fabric_api_version_range: "$fabric_api_version_range"
        )
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : "$mod_id",
                'Specification-Vendor'    : "Project-SUNSET",
                'Specification-Version'   : "1",
                'Implementation-Title'    : "$archiveBaseName",
                'Implementation-Version'  : this.project.jar.archiveVersion,
                'Implementation-Vendor'   : "Project-SUNSET",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    from zipTree(jar.archiveFile)
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    zip64 = true
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
