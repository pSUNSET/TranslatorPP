plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:$cloth_config_version"

    // JEI, REI, EMI?  (Unused)
//    compileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version"

    runtimeOnly "mezz.jei:jei-$minecraft_version-neoforge:$jei_version"
//    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"

    // FTB Quests

    // Jade
    runtimeOnly "maven.modrinth:jade:$jade_neoforge_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', "$mod_version"

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
                version: "$mod_version",
                neoforge_version_range: "$neoforge_version_range",
                minecraft_version_neoforge_range: "$minecraft_version_neoforge_range",
        ])
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : "$mod_id",
                'Specification-Vendor'    : "Project-SUNSET",
                'Specification-Version'   : "1",
                'Implementation-Title'    : "$archiveBaseName",
                'Implementation-Version'  : this.project.jar.archiveVersion,
                'Implementation-Vendor'   : "Project-SUNSET",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    from zipTree(jar.archiveFile)
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    zip64 = true
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
