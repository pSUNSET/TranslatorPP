architectury {
    common enabled_platforms.split(',')
}

repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Curse Maven"
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"

    modImplementation "dev.architectury:architectury:$architectury_api_version"

    modCompileOnlyApi "me.shedaniel.cloth:cloth-config:$cloth_config_version"

//    modCompileOnlyApi "mezz.jei:jei-$minecraft_version-common-api:$jei_version"
//    modCompileOnlyApi "me.shedaniel:RoughlyEnoughItems-api:$rei_version"
}
