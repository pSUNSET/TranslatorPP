plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
    id "me.modmuss50.mod-publish-plugin" version "2.0.0"
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream {
        stream -> secrets.load(stream)
    }
}

architectury {
    minecraft = "$minecraft_version"
}

allprojects {
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'java'

    group = "$maven_group"
    version = "${mod_version}+${it.name}-${minecraft_display_version}"

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
        maven {
            name = "Shedaniel"
            url = "https://maven.shedaniel.me/"
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "Modrinth Maven"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'

    base {
        archivesName = "$mod_id"
    }

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$minecraft_version"
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
        }
    }
}

publishMods {
    changelog = file("CHANGELOG.md").text
    type = STABLE

    def curseforgeSettings = curseforgeOptions {
        accessToken = secrets.getProperty("CURSEFORGE_TOKEN")
        projectId = "1254626"
        minecraftVersionRange {
            start = "26.2"
            end = "26.2"
        }
        javaVersions.add JavaVersion.VERSION_25

        clientRequired = true
        serverRequired = false

        changelogType = "markdown"
    }

    def modrinthSettings = modrinthOptions {
        accessToken = secrets.getProperty("MODRINTH_TOKEN")
        projectId = "Bl9j6Jsi"
        minecraftVersionRange {
            start = "26.2"
            end = "26.2"
        }
    }

    curseforge("curseforgeFabric") {
        from curseforgeSettings
        file project(":fabric")
        displayName = "[Fabric $minecraft_display_version] v$mod_version"
        version.set "$mod_version+fabric-$minecraft_display_version"
        modLoaders.addAll "fabric", "quilt"
    }

    curseforge("curseforgeNeoForge") {
        from curseforgeSettings
        file project(":neoforge")
        displayName = "[NeoForge $minecraft_display_version] v$mod_version"
        version.set "$mod_version+neoforge-$minecraft_display_version"
        modLoaders.add "neoforge"
    }

    modrinth("modrinthFabric") {
        from modrinthSettings
        file project(":fabric")
        displayName = "[Fabric $minecraft_display_version] v$mod_version"
        version.set "$mod_version+fabric-$minecraft_display_version"
        modLoaders.addAll "fabric", "quilt"
    }

    modrinth("modrinthNeoForge") {
        from modrinthSettings
        file project(":neoforge")
        displayName = "[NeoForge $minecraft_display_version] v$mod_version"
        version.set "$mod_version+neoforge-$minecraft_display_version"
        modLoaders.add "neoforge"
    }
}