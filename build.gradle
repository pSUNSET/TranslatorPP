plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream {
        stream -> secrets.load(stream)
    }
}

architectury {
    minecraft = "$minecraft_version"
}

allprojects {
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'java'

    group = "$maven_group"
    version = "${mod_version}+${minecraft_version_file_range}"

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
        maven {
            name = "Shedaniel"
            url = "https://maven.shedaniel.me/"
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "Modrinth Maven"
            url = "https://api.modrinth.com/maven/"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    base {
        archivesName = "$mod_id-$project.name"
    }

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$minecraft_version"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-$minecraft_version:$parchment_mappings_version@zip")
        }
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
        }
    }
}

publishMods {
    changelog = file("CHANGELOG.md").text
    type = BETA

    def curseforgeSettings = curseforgeOptions {
        accessToken = secrets.getProperty("CURSEFORGE_TOKEN")
        projectId = "1254626"
        minecraftVersionRange {
            start = "1.20"
            end = "1.20.1"
        }
        javaVersions.add JavaVersion.VERSION_17

        clientRequired = true
        serverRequired = false

        changelogType = "markdown"
    }

    def modrinthSettings = modrinthOptions {
        accessToken = secrets.getProperty("MODRINTH_TOKEN")
        projectId = "Bl9j6Jsi"
        minecraftVersionRange {
            start = "1.20"
            end = "1.20.1"
        }
    }

    curseforge("curseforgeFabric") {
        from curseforgeSettings
        file project(":fabric")
        displayName = "[Fabric $minecraft_version_file_range] v$mod_version"
        version.set "fabric-$mod_version+$minecraft_version_file_range"
        modLoaders.addAll "fabric", "quilt"
    }

    curseforge("curseforgeForge") {
        from curseforgeSettings
        file project(":forge")
        displayName = "[Forge $minecraft_version_file_range] v$mod_version"
        version.set "forge-$mod_version+$minecraft_version_file_range"
        modLoaders.add "forge"
    }

    modrinth("modrinthFabric") {
        from modrinthSettings
        file project(":fabric")
        displayName = "[Fabric $minecraft_version_file_range] v$mod_version"
        version.set "fabric-$mod_version+$minecraft_version_file_range"
        modLoaders.addAll "fabric", "quilt"
    }

    modrinth("modrinthForge") {
        from modrinthSettings
        file project(":forge")
        displayName = "[Forge $minecraft_version_file_range] v$mod_version"
        version.set "forge-$mod_version+$minecraft_version_file_range"
        modLoaders.add "forge"
    }
}
